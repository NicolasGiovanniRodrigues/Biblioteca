{% extends 'base.html' %}{% block content %}<a href="{{ url_for('users') }}">← Voltar aos usuários</a><h1>{{ title }}</h1><form class="card editor" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Nome</label><input id="name" name="name" value="{{ user.name if user else '' }}" maxlength="100" required><label for="email">E-mail</label><input id="email" type="email" name="email" value="{{ user.email if user else '' }}" maxlength="254" required><label for="role">Perfil</label><select id="role" name="role"><option value="user">Leitor (consulta o acervo)</option><option value="admin" {{ 'selected' if user and user.role == 'admin' }}>Administrador (gerencia livros e usuários)</option></select><label for="password">{{ 'Nova senha (opcional)' if editing else 'Senha' }}</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="64" aria-describedby="password-help" {{ 'required' if not editing }}><small id="password-help">12 a 64 caracteres, com maiúscula, minúscula, número e símbolo. Limite de 72 bytes. {{ 'Deixe vazio para manter a senha atual.' if editing }}</small><div class="actions"><button>Salvar usuário</button><a href="{{ url_for('users') }}">Cancelar</a></div></form>{% endblock %}
