{% extends 'base.html' %}{% block content %}<a href="{{ url_for('books') }}">← Voltar ao acervo</a><h1>{{ title }}</h1><form class="card editor" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Título</label><input id="title" name="title" value="{{ book.title if book else '' }}" maxlength="200" required><label for="author">Autor</label><input id="author" name="author" value="{{ book.author if book else '' }}" maxlength="150" required><label for="year">Ano de publicação</label><input id="year" name="publication_year" type="number" min="1" max="{{ max_year }}" value="{{ book.publication_year if book else '' }}" required><div class="actions"><button>Salvar livro</button><a href="{{ url_for('books') }}">Cancelar</a></div></form>{% endblock %}
