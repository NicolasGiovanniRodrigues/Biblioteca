<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · Biblioteca</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='app.js') }}"></script></head>
<body><header><a class="brand" href="{{ url_for('books') }}">B<span>Biblioteca</span></a>{% if g.user %}<nav><a href="{{ url_for('books') }}">Acervo</a>{% if g.user.role == 'admin' %}<a href="{{ url_for('users') }}">Usuários</a>{% endif %}</nav><div class="account"><span>{{ g.user.name }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="ghost">Sair</button></form></div>{% endif %}</header><main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Biblioteca · Gestão de acervo e usuários</footer></body></html>
