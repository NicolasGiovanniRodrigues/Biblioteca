<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar na Biblioteca</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>
    {% include 'menu.html' %}
    {% include 'mensagens.html' %}
    <main>
<form class="formulario" action="{{ url_for('login') }}" method="post"><h2>Login</h2><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="email">E-mail:</label><input id="email" type="email" name="email" autocomplete="username" required>
<label for="senha">Senha:</label><input id="senha" type="password" name="senha" autocomplete="current-password" required>
<button type="submit">Entrar</button><p>Peça seu cadastro ao administrador.</p></form>
    </main>
</body>
</html>
